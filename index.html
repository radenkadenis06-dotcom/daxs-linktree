<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>DAXS Production House</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@500;700&family=Roboto+Slab:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--line:#ffb43a;--or:#ff8a4a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:#000 ;overflow-x:hidden;color:#fff;font-family:"Poppins","Segoe UI",system-ui,sans-serif}
.wrap{max-width:420px;margin:0 auto;padding:14px 22px 36px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px}
.top button,.top select{background:rgba(255,255,255,.14);border:0;border-radius:999px;color:#fff;font:inherit;font-size:13px;padding:7px 14px}
.top select option{color:#000}
a.btn{display:flex;align-items:center;justify-content:center;min-height:52px;margin-bottom:12px;padding:0 16px;border:2px solid var(--or);border-radius:999px;background:rgba(0,0,0,.5);color:#fff;text-decoration:none;font-family:"Roboto","Segoe UI",system-ui,sans-serif;font-weight:700;transition:transform .15s,background .15s}
a.btn:active{transform:scale(1.02);background:rgba(255,138,74,.2)}
a.btn span{text-align:center;font-size:14px;letter-spacing:2.5px;line-height:1.25;text-transform:uppercase}
a.btn em{display:block;font-style:normal;font-weight:500;font-size:12px;letter-spacing:1px;opacity:.8;text-transform:none;margin-top:3px}
footer{text-align:center;font-size:12px;opacity:.6;margin-top:24px}
h2.pt{text-align:center;font-size:17px;letter-spacing:2.5px;font-weight:700;margin:6px 0 18px;line-height:1.3}
.card{background:rgba(0,0,0,.55);border:2px solid var(--or);border-radius:22px;padding:18px 16px;margin-bottom:14px}
.card h3{margin:0;font-size:15px;letter-spacing:1.5px;color:#ffb43a}
.card h4{margin:3px 0 10px;font-size:13.5px;font-weight:500;opacity:.9}
.card ul{margin:0;padding:0 0 0 18px;font-size:13.5px;line-height:1.6}
.card li{margin-bottom:5px}
.card p{font-size:13.5px;line-height:1.6;margin:8px 0}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.svc a{display:block;border:2px solid var(--or);border-radius:22px;padding:18px 12px;text-align:center;color:#fff;text-decoration:none;background:rgba(0,0,0,.5);font-size:15px;font-weight:600;letter-spacing:1px}
.svc a b{display:block;color:var(--line);font-size:13px;margin-bottom:6px}
.svc a:active{background:rgba(255,180,58,.2)}
.sub{text-align:center;opacity:.85;font-size:13px;margin:-6px 0 16px}
.bk{background:rgba(0,0,0,.55);border:2px solid var(--or);border-radius:22px;padding:16px 16px 20px}
.bk label{display:block;font-weight:600;font-size:13px;letter-spacing:.5px;margin:14px 0 7px}
.bk label small{font-weight:400;opacity:.65}
.bk input,.bk select{display:block;width:100%;min-width:0;max-width:100%;height:48px;background:rgba(0,0,0,.55);border:1.5px solid rgba(255,138,74,.7);border-radius:999px;color:#fff;font:inherit;font-size:15px;padding:0 18px;-webkit-appearance:none;appearance:none;color-scheme:dark}
.bk input::placeholder{color:rgba(255,255,255,.45)}
.go{display:block;width:100%;margin-top:22px;height:52px;border-radius:999px;border:2px solid var(--or);background:rgba(0,0,0,.5);color:#fff;font:inherit;font-weight:700;letter-spacing:2.5px;font-size:14px}.go:active{background:rgba(255,138,74,.2)}
.note{font-size:13px;opacity:.8;line-height:1.5;margin-top:16px;text-align:center}
.err{color:#ff8a8a;font-size:13px;text-align:center;margin-top:12px;min-height:16px}
[dir=rtl] a.btn span{direction:rtl}
[dir=rtl] .card ul{padding:0 20px 0 0}
.logo{display:block;width:58%;max-width:210px;height:auto;margin:6px auto 0}
h1.wl{margin:6px 0 0;text-align:center;font-family:"Bebas Neue","Oswald","Impact","Arial Narrow",sans-serif;font-weight:400;font-size:clamp(34px,11vw,46px);letter-spacing:3px;line-height:1}
html[lang=ru] h1.wl{font-family:"Roboto",Arial,sans-serif;font-weight:700;font-size:clamp(24px,7.5vw,32px);letter-spacing:1px;line-height:1.15}
p.as{margin:6px 0 18px;text-align:center;font-family:"Roboto Slab",Georgia,serif;font-size:14px;letter-spacing:.5px;text-transform:uppercase}
.card ul.nl{list-style:none;padding:0}.card ul.nl li{padding-left:14px;position:relative}.card ul.nl li:before{content:"•";position:absolute;left:0;color:var(--or)}
[dir=rtl] .card ul.nl li{padding:0 14px 0 0}[dir=rtl] .card ul.nl li:before{left:auto;right:0}

["02 — PAQUETE SIGNATURE","Experiencia visual mejorada",["Servicio profesional de fotografía y/o videografía.","Cobertura de rodaje ampliada según los requisitos del proyecto.","Dirección creativa y composición visual.","Oportunidades de captura ilimitadas durante la duración acordada de la sesión.","Selección y curaduría profesional del material grabado.","Retoque fotográfico avanzado y edición de vídeo profesional.","Etalonaje de color premium.","Vídeo destacado cinematográfico para redes sociales (30 segundos).","Entrega digital en alta resolución.","Formatos de entrega personalizados para varias plataformas."]],
["03 — PAQUETE EXCLUSIVE","Experiencia de producción premium",["Producción integral de fotografía y videografía.","Concepto creativo y planificación de producción personalizados.","Dirección de rodaje y narrativa visual a medida.","Documentación fotográfica y en vídeo completa.","Selección profesional de imágenes y retoque detallado.","Edición de vídeo cinematográfica avanzada.","Etalonaje cinematográfico premium.","Múltiples versiones de vídeo adaptadas a distintas plataformas.","Producción profesional de contenido para redes sociales.","Entrega de fotos y vídeos en alta resolución.","Requisitos de producción y entregables personalizados.","Consultoría dedicada y coordinación de la producción."]]],

var lang="en";
try{lang=localStorage.getItem("daxs_lang")||""}catch(e){}
if(!T[lang]){var n=(navigator.language||"en").slice(0,2).toLowerCase();lang=T[n]?n:"en"}
function btn(h,t,s,ext){if(!h)h="javascript:void(0)";return '<a class="btn" href="'+h+'"'+(ext?' target="_blank" rel="noopener"':'')+'><span>'+t+(s?'<em>'+s+'</em>':'')+'</span></a>'}
function bar(home){var o="";for(var k in L)o+='<option value="'+k+'"'+(k==lang?" selected":"")+'>'+L[k]+'</option>';
var t=T[lang];return '<div class="top">'+(home?'<span></span>':'<button onclick="location.hash=\'\'">← '+t.back+'</button>')+'<select id="lg" aria-label="Language">'+o+'</select></div>'}
function render(){var t=T[lang],h=(location.hash||"").replace("#","").split("/"),v=h[0],x="";
document.documentElement.lang=lang;document.documentElement.dir=lang=="ar"?"rtl":"ltr";
if(v=="package"){x=bar(0)+'<h2 class="pt">'+t.hdr+'</h2>';
t.p.forEach(function(p){x+='<div class="card"><h3>'+p[0]+'</h3><h4>'+p[1]+'</h4><ul>'+p[2].map(function(i){return '<li>'+i+'</li>'}).join("")+'</ul></div>'});
x+='<div class="card"><h3>'+t.fx+'</h3><p>'+t.f1+'</p><p>'+t.f2+'</p><ul>'+t.fl.map(function(i){return '<li>'+i+'</li>'}).join("")+'</ul><p>'+t.f3+'</p><p>'+t.f4+'</p></div>'}
else if(v=="services"){x=bar(0)+'<h2 class="pt">'+t.sv+'</h2><p class="sub">'+t.stap+'</p><div class="svc">'+t.s.map(function(s,i){var n=(i+1<10?"0":"")+(i+1);return '<a href="#booking/'+i+'"><b>'+n+'</b>'+s.toUpperCase()+'</a>'}).join("")+'</div>'}
else if(v=="booking"){var si=parseInt(h[1])||0;
x=bar(0)+'<h2 class="pt">'+t.bk+'</h2><p class="sub">'+t.bi+'</p><div class="bk"><label>'+t.f_s+'</label><select id="fs">'+t.s.map(function(s,i){return '<option value="'+i+'"'+(i==si?" selected":"")+'>'+s+'</option>'}).join("")+'</select><label>'+t.f_n+'</label><input id="fn" placeholder="'+t.pn+'" autocomplete="name"><label>'+t.f_d+' <small>'+t.tap+'</small></label><input id="fd" type="date"><label>'+t.f_t+' <small>'+t.tap+'</small></label><input id="ft" type="time"><label>'+t.f_l+'</label><input id="fl" placeholder="'+t.pl+'"><label>'+t.f_p+'</label><input id="fp" type="tel" placeholder="'+t.pp+'" autocomplete="tel"><button class="go" id="go">'+t.send+' →</button><div class="err" id="er"></div></div><p class="note">'+t.nt+'</p>'}
else if(v=="notice"){var u=X[lang];x=bar(0)+'<h2 class="pt">'+u.nb+'</h2><div class="card"><h3>'+u.nh+'</h3><ul class="nl" style="margin-top:12px">'+u.n.map(function(i){return '<li>'+i+'</li>'}).join("")+'</ul></div>'}
else if(v=="instagram"){x=bar(0)+'<h2 class="pt">INSTAGRAM</h2>'+btn(IG1,"@daxs_frame","",1)+btn(IG2,"@radenka.denisss","",1)}
else if(v=="contact"){var u=X[lang];x=bar(0)+'<h2 class="pt">'+u.ct+'</h2>'+btn("https://wa.me/"+WA,t.wa,t.was,1)+btn("mailto:"+MAIL,t.em,MAIL)}
else{var u=X[lang];x=bar(1)+'<img class="logo" alt="DAXS Production House" src="data:image/png;base64,'+LOGO+'"><h1 class="wl">'+u.wl+'</h1><p class="as">'+u.as+'</p>'+btn("#package",t.pk)+btn("#services",t.sv)+btn("#notice",u.nb)+btn("#instagram","Instagram")+btn(TT,"TikTok",0,1)+btn("#contact",u.ct)+btn(LI,"LinkedIn",0,1)}
document.getElementById("app").innerHTML=x;window.scrollTo(0,0);
document.getElementById("lg").onchange=function(){lang=this.value;try{localStorage.setItem("daxs_lang",lang)}catch(e){}render()};
var g=document.getElementById("go");if(g)g.onclick=send}
function send(){var t=T[lang],v=function(i){return document.getElementById(i).value.trim()};
if(!v("fn")||!v("fd")||!v("ft")||!v("fl")||!v("fp")){document.getElementById("er").textContent=t.er;return}
var sv=T.en.s[document.getElementById("fs").value];
var m="Hello DAXS Production House, I would like to make a booking.\n\nService: "+sv+"\nName: "+v("fn")+"\nDate: "+v("fd")+"\nTime: "+v("ft")+"\nLocation: "+v("fl")+"\nPhone/WhatsApp: "+v("fp");
location.href="https://wa.me/"+WA+"?text="+encodeURIComponent(m)}
window.onhashchange=render;render();
</script></body></html>
