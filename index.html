/Z) center/cover fixed no-repeat;color:#fff;font-family:"Poppins","Segoe UI",system-ui,sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:22px 18px 48px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px}
.top button,.top select{background:rgba(255,255,255,.14);backdrop-filter:blur(8px);border:0;border-radius:999px;color:#fff;font:inherit;font-size:14px;padding:9px 16px}
.top select option{color:#000}
.head{display:flex;gap:16px;align-items:center}
.head img{width:120px;height:auto;border-radius:16px}
.head h1{margin:0;font-size:22px;font-weight:500}
.head p{margin:4px 0 0;font-size:14px;letter-spacing:.3px;opacity:.9}
.head small{display:block;margin-top:6px;opacity:.75}
.bio{margin:22px 0;background:linear-gradient(135deg,#e8333f,#ffb43a);border-radius:28px;padding:22px 24px;font-size:20px;line-height:1.35;font-weight:600}
a.btn{display:flex;align-items:center;gap:14px;min-height:76px;margin-bottom:14px;padding:0 18px;border:2.5px solid var(--line);border-radius:999px;background:rgba(10,10,14,.5);backdrop-filter:blur(10px);color:#fff;text-decoration:none;transition:transform .15s,background .15s}
a.btn:active{transform:scale(1.02);background:rgba(255,180,58,.18)}
a.btn svg{width:34px;height:34px;flex:none;fill:none;stroke:var(--line);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
a.btn span{flex:1;text-align:center;font-size:19px;line-height:1.2}
a.btn em{display:block;font-style:normal;font-size:13px;opacity:.8}
a.btn i{width:34px;text-align:center;opacity:.8;font-style:normal;font-size:22px}
footer{text-align:center;font-size:12px;opacity:.6;margin-top:24px}
h2.pt{text-align:center;font-size:20px;letter-spacing:3px;font-weight:700;margin:6px 0 18px;line-height:1.3}
.card{background:linear-gradient(160deg,rgba(30,60,140,.55),rgba(8,12,40,.75));border:1.5px solid rgba(120,160,255,.45);border-radius:26px;padding:22px 20px;margin-bottom:18px;backdrop-filter:blur(10px);box-shadow:0 0 28px rgba(60,110,255,.18)}
.card h3{margin:0;font-size:17px;letter-spacing:1.5px;color:#ffb43a}
.card h4{margin:4px 0 12px;font-size:15px;font-weight:500;opacity:.9}
.card ul{margin:0;padding:0 0 0 20px;font-size:14.5px;line-height:1.6}
.card li{margin-bottom:5px}
.card p{font-size:14.5px;line-height:1.6;margin:8px 0}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.svc a{display:block;border:2px solid var(--line);border-radius:22px;padding:18px 12px;text-align:center;color:#fff;text-decoration:none;background:rgba(10,10,14,.55);backdrop-filter:blur(10px);font-size:15px;font-weight:600;letter-spacing:1px}
.svc a b{display:block;color:var(--line);font-size:13px;margin-bottom:6px}
.svc a:active{background:rgba(255,180,58,.2)}
.sub{text-align:center;opacity:.85;font-size:14px;margin:-6px 0 16px}
.bk{background:linear-gradient(160deg,rgba(30,64,160,.6),rgba(6,10,40,.85));border:1.5px solid rgba(110,150,255,.5);border-radius:28px;padding:22px 18px;box-shadow:0 0 36px rgba(60,110,255,.25)}
.bk label{display:block;font-weight:600;font-size:14px;letter-spacing:.5px;margin:16px 0 8px}
.bk label small{font-weight:400;opacity:.65}
.bk input,.bk select{display:block;width:100%;min-width:0;max-width:100%;height:54px;background:#060c28;border:1.5px solid rgba(110,140,230,.5);border-radius:18px;color:#fff;font:inherit;font-size:16px;padding:0 16px;-webkit-appearance:none;appearance:none;color-scheme:dark}
